[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-microsoft-auth"
version = "0.1.0"
description = "Windows-first Microsoft Graph auth foundation for Midtown dev toys"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Thomas Bray", email = "thomas.bray@midtown.net"}]
dependencies = [
    "msal[broker]>=1.29; platform_system == 'Windows'",
    "msal>=1.29; platform_system != 'Windows'",
    "msal_extensions>=1.0; platform_system == 'Windows'",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/Midtown-Technology-Group/mtg-microsoft-auth"
Repository = "https://github.com/Midtown-Technology-Group/mtg-microsoft-auth"

[project.scripts]
mtg-auth = "mtg_microsoft_auth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
